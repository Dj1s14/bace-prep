name: Validate BACE cloud-save repair

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/lesson-progress-cloud-save-20261117]

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Vite production build
        run: npm run build

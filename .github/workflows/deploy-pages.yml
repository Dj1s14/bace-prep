name: Deploy BACE Prep to GitHub Pages
# Pages enabled; this workflow also serves as the production build check.

on:
  push:
    branches:
      - main
      - curriculum/bace-current-alignment
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check
        id: typecheck
        continue-on-error: true
        run: npm run lint 2>&1 | tee tsc.log

      - name: Upload type-check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-log
          path: tsc.log

      - name: Fail if type-check failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1

      - name: Build static site
        id: buildsite
        continue-on-error: true
        run: npm run build:pages 2>&1 | tee vite-build.log
        env:
          VITE_BASE_PATH: /bace-prep/
          VITE_SUPABASE_URL: https://gfdbcrfqbsowlbnprqqn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zo9w_tbm9sgRfSjT52sXXA_WaFcZwF5

      - name: Upload Vite build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-log
          path: vite-build.log

      - name: Fail if build failed
        if: steps.buildsite.outcome == 'failure'
        run: exit 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
